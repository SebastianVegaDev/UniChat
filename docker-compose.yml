services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-unichat}
      POSTGRES_USER: ${POSTGRES_USER:-unichat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-unichat_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend/src/schema/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PORT: 3000
      CLIENT_ORIGINS: ${CLIENT_ORIGINS:-http://localhost:8080,http://localhost:5173}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-unichat}
      DB_USER: ${POSTGRES_USER:-unichat}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-unichat_password}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-local-docker}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-nano}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-220}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_POLLY_VOICE_ID: ${AWS_POLLY_VOICE_ID:-Enrique}
      AWS_POLLY_ENGINE: ${AWS_POLLY_ENGINE:-neural}
      AWS_POLLY_OUTPUT_FORMAT: ${AWS_POLLY_OUTPUT_FORMAT:-mp3}
      AWS_POLLY_SAMPLE_RATE: ${AWS_POLLY_SAMPLE_RATE:-24000}
      AWS_POLLY_MAX_CHARS: ${AWS_POLLY_MAX_CHARS:-2500}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
        VITE_SOCKET_URL: /
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  db_data:
  uploads_data:
